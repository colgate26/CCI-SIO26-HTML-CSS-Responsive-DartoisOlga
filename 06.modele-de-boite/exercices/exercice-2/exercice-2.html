<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Comparaison box-sizing</title>
    <style>
        .a, .b {
            width: 200px;
            padding: 20px;
            border: 10px solid #1e5a8e;
            margin-bottom: 15px;
            background: #dbe9f5;
        }
        .a, .b {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="a">Boîte A</div>
    <div class="b">Boîte B</div>
</body>
</html>
